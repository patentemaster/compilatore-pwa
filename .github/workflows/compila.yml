name: Compilatore Cloud PWA Professionale
on:
  repository_dispatch:
    types: [avvia_compilazione]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Configura Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Installa Java e Android SDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Inizializza Progetto Android con Capacitor
      run: |
        URL_PWA="${{ github.event.client_payload.url_pwa }}"
        APP_NAME="${{ github.event.client_payload.app_name }}"
        PACKAGE_ID="${{ github.event.client_payload.package_id }}"
        PASS_KEY="${{ github.event.client_payload.keystore_password }}"

        # Crea una struttura fittizia richiesta da Capacitor
        mkdir www
        echo "<html><body>Fallback</body></html>" > www/index.html

        # Installa Capacitor ed assegna i parametri reali ricevuti da Base44
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=www

        # Configura Capacitor per puntare direttamente all'URL reale della PWA
        node -e "
        const fs = require('fs');
        const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
        config.server = { url: '$URL_PWA', cleartext: true };
        fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
        "

        # Aggiunge la piattaforma Android nativa
        npx cap add android

        # Genera la chiave di firma digitale (.keystore) obbligatoria per Google
        keytool -genkeypair -v \
          -keystore android.keystore \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "$PASS_KEY" \
          -keypass "$PASS_KEY" \
          -dname "CN=$APP_NAME, OU=Mobile, O=Base44Compiler, L=Roma, S=Italia, C=IT"

    - name: Compila il Pacchetto .AAB Firmato
      run: |
        PASS_KEY="${{ github.event.client_payload.keystore_password }}"
        cd android
        
        # Esegue la compilazione nativa Android tramite Gradle
        ./gradlew bundleRelease
        
        # Firma il file .aab generato usando la chiave creata nel passaggio precedente
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
          -keystore ../android.keystore \
          -storepass "$PASS_KEY" \
          -keypass "$PASS_KEY" \
          app/build/outputs/bundle/release/app-release-initial.aab androidkey
          
        cp app/build/outputs/bundle/release/app-release-initial.aab ../applicazione-firmata.aab

    - name: Rendi il file .AAB scaricabile su Base44
      uses: actions/upload-artifact@v4
      with:
        name: applicazione-playstore
        path: ./applicazione-firmata.aab
