name: Compilatore Cloud PWA Professionale

on:
  repository_dispatch:
    types: [avvia_compilazione]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Inizializza Progetto Android con Capacitor
        run: |
          URL_PWA="${{ github.event.client_payload.url_pwa }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_ID="${{ github.event.client_payload.package_id }}"
          PASS_KEY="${{ github.event.client_payload.keystore_password }}"

          npm cache clean --force
          npm install -g npm@11.14.1

          mkdir www
          echo "<html><body>Fallback</body></html>" > www/index.html

          npm install @capacitor/core @capacitor/cli @capacitor/android

          printf "n\n" | npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=www

          echo "{
            \"appId\": \"$PACKAGE_ID\",
            \"appName\": \"$APP_NAME\",
            \"webDir\": \"www\",
            \"server\": { \"url\": \"$URL_PWA\", \"cleartext\": true }
          }" > capacitor.config.json

          npx cap add android

          echo "kotlin.version=1.8.22" >> android/gradle.properties

          echo "buildscript { ext.kotlin_version = '1.8.22' }" | cat - android/build.gradle > temp && mv temp android/build.gradle

          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7' }" >> android/app/build.gradle
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias androidkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS_KEY" \
            -keypass "$PASS_KEY" \
            -dname "CN=$APP_NAME, OU=Mobile, O=Base44Compiler, L=Roma, S=Italia, C=IT"

      - name: Compila il Pacchetto .AAB Firmato
        run: |
          PASS_KEY="${{ github.event.client_payload.keystore_password }}"
          cd android

          ./gradlew bundleRelease

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore ../android.keystore \
            -storepass "$PASS_KEY" \
            -keypass "$PASS_KEY" \
            app/build/outputs/bundle/release/app-release.aab androidkey

          cp app/build/outputs/bundle/release/app-release.aab ../applicazione-firmata.aab

      - name: Rendi il file .AAB scaricabile su Base44
        uses: actions/upload-artifact@v4
        with:
          name: applicazione-playstore
          path: ./applicazione-firmata.aab
