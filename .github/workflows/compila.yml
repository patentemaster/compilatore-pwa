name: Compilatore Cloud PWA Professionale
on:
  repository_dispatch:
    types: [avvia_compilazione]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Configura Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Installa Java e Android SDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Installa Bubblewrap CLI di Google
      run: npm install -g @bubblewrap/cli

    - name: Configura Parametri e Genera Chiave Digitale
      run: |
        URL_PWA="${{ github.event.client_payload.url_pwa }}"
        APP_NAME="${{ github.event.client_payload.app_name }}"
        PACKAGE_ID="${{ github.event.client_payload.package_id }}"
        PASS_KEY="${{ github.event.client_payload.keystore_password }}"
        
        # Sblocco definitivo: creiamo a forza il file di configurazione interna di Bubblewrap
        # Inseriamo i percorsi esatti di Java (JDK) e dell'Android SDK di GitHub Actions per evitare le domande
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"/usr/local/lib/android/sdk\"}" > ~/.bubblewrap/config.json
        
        # Ora inizializziamo senza il rischio che chieda l'installazione del JDK
        bubblewrap init --manifest=$URL_PWA/manifest.json --no-interactive --packageName="$PACKAGE_ID" --appName="$APP_NAME"

        # Crea la chiave digitale reale nativa Android
        keytool -genkeypair -v \
          -keystore android.keystore \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "$PASS_KEY" \
          -keypass "$PASS_KEY" \
          -dname "CN=$APP_NAME, OU=Mobile, O=Base44Compiler, L=Roma, S=Italia, C=IT"

    - name: Compila il Pacchetto .AAB Firmato
      run: |
        PASS_KEY="${{ github.event.client_payload.keystore_password }}"
        bubblewrap build --signingKeyPath=android.keystore --signingKeyAlias=androidkey --signingKeyPassword="$PASS_KEY" --signingStorePassword="$PASS_KEY"

    - name: Rendi il file .AAB scaricabile su Base44
      uses: actions/upload-artifact@v4
      with:
        name: applicazione-playstore
        path: ./*.aab
