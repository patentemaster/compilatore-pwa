name: Compilatore Cloud PWA Professionale
on:
  repository_dispatch:
    types: [avvia_compilazione]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Configura Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Installa Java e Android SDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Installa Bubblewrap CLI di Google
      run: npm install -g @bubblewrap/cli

    - name: Configura Parametri e Genera Chiave Digitale
      run: |
        URL_PWA="${{ github.event.client_payload.url_pwa }}"
        APP_NAME="${{ github.event.client_payload.app_name }}"
        PACKAGE_ID="${{ github.event.client_payload.package_id }}"
        PASS_KEY="${{ github.event.client_payload.keystore_password }}"
        
        # 1. Configurazione interna per evitare le domande sul JDK
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"/usr/local/lib/android/sdk\"}" > ~/.bubblewrap/config.json
        
        # 2. Scarichiamo il vero manifest della PWA
        curl -sL "$URL_PWA/manifest.json" -o manifest.json
        
        # 3. CREAZIONE MICRO SERVER LOCALE ANTI-CORS E ANTI-WIX COOKIE
        node -e "
        const http = require('http');
        const fs = require('fs');
        http.createServer((req, res) => {
          res.writeHead(200, { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' });
          res.end(fs.readFileSync('manifest.json'));
        }).listen(8080);
        " &
        
        # Attendiamo un secondo che il server locale si accenda
        sleep 2
        
        # 4. Inizializziamo Bubblewrap puntando al server locale finto (Bypass totale dei blocchi)
        yes "" | bubblewrap init --manifest=http://localhost:8080/manifest.json --no-interactive --packageName="$PACKAGE_ID" --appName="$APP_NAME"

        # 5. Crea la chiave digitale reale nativa Android
        keytool -genkeypair -v \
          -keystore android.keystore \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "$PASS_KEY" \
          -keypass "$PASS_KEY" \
          -dname "CN=$APP_NAME, OU=Mobile, O=Base44Compiler, L=Roma, S=Italia, C=IT"

    - name: Compila il Pacchetto .AAB Firmato
      run: |
        PASS_KEY="${{ github.event.client_payload.keystore_password }}"
        yes "" | bubblewrap build --signingKeyPath=android.keystore --signingKeyAlias=androidkey --signingKeyPassword="$PASS_KEY" --signingStorePassword="$PASS_KEY"

    - name: Rendi il file .AAB scaricabile su Base44
      uses: actions/upload-artifact@v4
      with:
        name: applicazione-playstore
        path: ./*.aab
